<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a5d68"/>
      <stop offset="60%" stop-color="#8a9ba8"/>
      <stop offset="100%" stop-color="#cfd8dc"/>
    </linearGradient>
    <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#555a60"/>
      <stop offset="100%" stop-color="#3a3f45"/>
    </linearGradient>
    <linearGradient id="exideSign" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e65100"/>
      <stop offset="50%" stop-color="#f57c00"/>
      <stop offset="100%" stop-color="#ff9800"/>
    </linearGradient>
    <linearGradient id="roFrame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0277bd"/>
      <stop offset="100%" stop-color="#01579b"/>
    </linearGradient>
  </defs>

  <!-- Background Building & Sky -->
  <rect width="600" height="800" fill="#90a4ae"/>
  <rect y="0" width="600" height="280" fill="url(#skyGrad)"/>

  <!-- Top Phone Banner -->
  <rect x="0" y="0" width="600" height="75" fill="#111827"/>
  <text x="300" y="52" font-family="system-ui, sans-serif" font-weight="900" font-size="44" fill="#ef4444" text-anchor="middle" letter-spacing="3">91500 51486</text>

  <!-- Store Name Overlay -->
  <rect x="30" y="90" width="540" height="95" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.9"/>
  <text x="300" y="145" font-family="system-ui, sans-serif" font-weight="900" font-size="40" fill="#ffffff" text-anchor="middle" letter-spacing="2">VANIYAMBADI</text>
  <text x="300" y="172" font-family="system-ui, sans-serif" font-weight="800" font-size="20" fill="#f1f5f9" text-anchor="middle" letter-spacing="4">HITEK SOLUTION</text>

  <!-- Building Wall & Windows -->
  <rect x="20" y="200" width="560" height="500" fill="#b0bec5"/>
  <rect x="50" y="210" width="100" height="80" fill="#37474f" rx="4"/>
  <line x1="100" y1="210" x2="100" y2="290" stroke="#78909c" stroke-width="2"/>
  <line x1="50" y1="250" x2="150" y2="250" stroke="#78909c" stroke-width="2"/>

  <!-- EXIDE Signboard -->
  <g transform="translate(90, 270)">
    <rect width="420" height="95" fill="url(#exideSign)" rx="6" stroke="#bf360c" stroke-width="3"/>
    <text x="30" y="60" font-family="Impact, sans-serif" font-weight="900" font-size="52" fill="#ffffff" letter-spacing="2">EXIDE</text>
    <text x="210" y="55" font-family="system-ui, sans-serif" font-weight="bold" font-size="26" fill="#ffe0b2">எக்ஸைட்</text>
    <!-- Battery Icons on Signboard -->
    <rect x="325" y="20" width="38" height="50" fill="#ffeb3b" stroke="#333" stroke-width="2" rx="2"/>
    <rect x="372" y="20" width="38" height="50" fill="#d32f2f" stroke="#333" stroke-width="2" rx="2"/>
    <rect x="335" y="14" width="8" height="6" fill="#333"/>
    <rect x="345" y="14" width="8" height="6" fill="#333"/>
    <rect x="382" y="14" width="8" height="6" fill="#333"/>
    <rect x="392" y="14" width="8" height="6" fill="#333"/>
  </g>

  <!-- Lightbox RO Arch Entryway (From actual photo) -->
  <g transform="translate(100, 365)">
    <!-- Top Header of Arch -->
    <rect x="0" y="0" width="400" height="70" fill="url(#roFrame)" stroke="#00e5ff" stroke-width="2" rx="4"/>
    <text x="200" y="32" font-family="system-ui, sans-serif" font-weight="bold" font-size="16" fill="#ffffff" text-anchor="middle">RO WATER PURIFIER SPECIALIST</text>
    <text x="200" y="55" font-family="system-ui, sans-serif" font-weight="600" font-size="13" fill="#e0f7fa" text-anchor="middle">100% PURE & HEALTHY DRINKING WATER</text>

    <!-- Left Pillar (Sales & Service) -->
    <rect x="0" y="70" width="70" height="260" fill="#0277bd" stroke="#00e5ff" stroke-width="2"/>
    <rect x="5" y="75" width="60" height="35" fill="#ff5722" rx="2"/>
    <text x="35" y="90" font-family="system-ui, sans-serif" font-weight="bold" font-size="10" fill="#ffffff" text-anchor="middle">SALES</text>
    <text x="35" y="102" font-family="system-ui, sans-serif" font-weight="bold" font-size="10" fill="#ffffff" text-anchor="middle">&amp; SERVICE</text>
    <!-- RO models on pillar -->
    <rect x="10" y="120" width="50" height="55" fill="#e0f2fe" rx="4" stroke="#0284c7"/>
    <circle cx="35" cy="147" r="14" fill="#38bdf8"/>
    <rect x="10" y="185" width="50" height="55" fill="#fbcfe8" rx="4" stroke="#db2777"/>
    <circle cx="35" cy="212" r="14" fill="#f43f5e"/>
    <rect x="10" y="250" width="50" height="55" fill="#e0f2fe" rx="4" stroke="#0284c7"/>

    <!-- Right Pillar (Sales & Service) -->
    <rect x="330" y="70" width="70" height="260" fill="#0277bd" stroke="#00e5ff" stroke-width="2"/>
    <rect x="335" y="75" width="60" height="35" fill="#ff5722" rx="2"/>
    <text x="365" y="90" font-family="system-ui, sans-serif" font-weight="bold" font-size="10" fill="#ffffff" text-anchor="middle">SALES</text>
    <text x="365" y="102" font-family="system-ui, sans-serif" font-weight="bold" font-size="10" fill="#ffffff" text-anchor="middle">&amp; SERVICE</text>
    <!-- RO models on right pillar -->
    <rect x="340" y="120" width="50" height="55" fill="#e0f2fe" rx="4" stroke="#0284c7"/>
    <rect x="340" y="185" width="50" height="55" fill="#ffedd5" rx="4" stroke="#ea580c"/>
    <rect x="340" y="250" width="50" height="55" fill="#e0f2fe" rx="4" stroke="#0284c7"/>

    <!-- Shop Interior Window / Shelves -->
    <rect x="70" y="70" width="260" height="260" fill="#1e293b"/>
    <!-- Stack of inverters and batteries -->
    <rect x="85" y="150" width="230" height="40" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <rect x="90" y="200" width="60" height="55" fill="#3b82f6" rx="3"/>
    <rect x="160" y="200" width="60" height="55" fill="#e2e8f0" rx="3"/>
    <rect x="230" y="200" width="60" height="55" fill="#1e293b" rx="3" stroke="#64748b"/>
    <rect x="90" y="265" width="60" height="55" fill="#1e293b" rx="3" stroke="#64748b"/>
    <rect x="160" y="265" width="60" height="55" fill="#3b82f6" rx="3"/>
    <rect x="230" y="265" width="60" height="55" fill="#1e293b" rx="3" stroke="#64748b"/>
  </g>

  <!-- Ground & Street -->
  <rect x="0" y="690" width="600" height="110" fill="url(#roadGrad)"/>
  <rect x="70" y="680" width="460" height="18" fill="#78909c"/>

  <!-- Motorcycle silhouette on street (from photo) -->
  <path d="M40 730 C60 700 80 690 120 700 L140 720 L160 710 L190 730 L170 770 L140 780 L110 775 L80 780 Z" fill="#1e293b"/>
  <circle cx="70" cy="760" r="28" fill="#0f172a" stroke="#475569" stroke-width="6"/>
  <circle cx="160" cy="760" r="28" fill="#0f172a" stroke="#475569" stroke-width="6"/>

  <!-- Live Store Info Tag -->
  <g transform="translate(180, 730)">
    <rect width="240" height="42" rx="21" fill="#dcff73" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.4))"/>
    <text x="120" y="26" font-family="system-ui, sans-serif" font-weight="800" font-size="14" fill="#102b2a" text-anchor="middle">SHOWROOM &amp; WORKSHOP</text>
  </g>
</svg>
